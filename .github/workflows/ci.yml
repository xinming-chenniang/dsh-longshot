name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # pnpm 11.28 要求 Node ≥22.13；运行时仍声明 node >=20，但 CI 工具链装不了 Node 20。
        # 实测 run 39792560768：Node 20 + pnpm 11.28.5 在 setup-node 阶段就崩
        # ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite（cache: pnpm 会先跑 pnpm）。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm pack --dry-run
